name: Gem Tasks

on:
  push:

jobs:
  gem:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - 'ubuntu-latest'
        - 'windows-latest'
    steps:
    - uses: actions/checkout@v2
      with:
        repository: ashmaroli/jekyll
        ref: '4.2-stable'
    - name: "Set up Ruby 2.7"
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '2.7'
        bundler-cache: true
    - name: Build Gem
      run: gem build jekyll.gemspec
    - name: Upload Artifact
      uses: actions/upload-artifact@v2
      with:
        name: 'v4.2.1.${{ matrix.os }}'
        path: jekyll-4.2.1.gem
